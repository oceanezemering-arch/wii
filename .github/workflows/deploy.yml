name: Deploy naar Firebase
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Inloggegevens klaarzetten
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$HOME/sa.json"
      - name: Hosting en regels uitrollen
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/../sa.json
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$HOME/sa.json"
          npx --yes firebase-tools@13 deploy --only hosting,firestore --project "${{ vars.FIREBASE_PROJECT_ID }}" --non-interactive
